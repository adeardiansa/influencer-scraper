<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IndoKOL & Influencer Scraper (Indonesia)</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <main class="glass-container">
        <header class="app-header">
            <div class="logo">
                <i data-lucide="scan-search"></i>
                <h1>Indo<span>KOL Scraper</span></h1>
            </div>
            <p>Discovery & Scraping KOL Instagram, Lynk.id & Linktree Khusus Indonesia 🇮🇩</p>
        </header>

        <section class="search-section">
            <form id="search-form">
                <div class="api-group">
                    <div class="api-input-wrapper">
                        <i data-lucide="key" class="api-icon"></i>
                        <input type="password" id="api-token-input" placeholder="Apify API Token (apify_api_...)" autocomplete="off">
                        <button type="button" id="btn-toggle-token" class="btn-icon" title="Lihat/Sembunyikan Token">
                            <i data-lucide="eye" id="icon-eye"></i>
                        </button>
                    </div>
                    <span class="api-badge"><i data-lucide="zap"></i> Powered by Apify</span>
                </div>

                <div class="input-group">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="keyword-input" placeholder="Ketik topik/niche, misal: fashion, beauty, kuliner, gadget..." required autocomplete="off">
                    <button type="submit" id="search-btn">
                        <span>Cari Influencer</span>
                        <div class="spinner hide"></div>
                    </button>
                </div>

                <!-- Filter Platform & Target Jumlah -->
                <div class="filters-group">
                    <div class="filter-item">
                        <i data-lucide="layers" class="filter-icon"></i>
                        <select id="platform-select" title="Pilih Platform">
                            <option value="all">🌐 Semua (Instagram KOL + Lynk.id + Linktree)</option>
                            <option value="instagram">📸 Hanya KOL Instagram</option>
                            <option value="lynk">🔗 Hanya Lynk.id</option>
                            <option value="linktree">🌳 Hanya Linktree (Indonesia)</option>
                        </select>
                    </div>

                    <div class="filter-item">
                        <i data-lucide="sliders" class="filter-icon"></i>
                        <select id="limit-select" title="Target Jumlah Hasil Minimal">
                            <option value="10" selected>🎯 Target Minimal: 10 Hasil</option>
                            <option value="15">🎯 Target Minimal: 15 Hasil</option>
                            <option value="20">🎯 Target Minimal: 20 Hasil</option>
                            <option value="30">🎯 Target Minimal: 30 Hasil</option>
                        </select>
                    </div>

                    <div class="filter-badge-id" title="Scraping khusus regional Indonesia">
                        <span>🇮🇩 Khusus Indonesia</span>
                    </div>
                </div>
            </form>
        </section>

        <section id="status-container" class="status-box hide">
            <div class="status-header">
                <i data-lucide="activity"></i>
                <h3>Live Status</h3>
            </div>
            <div id="status-text" class="status-text">Menunggu instruksi...</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </section>

        <section id="results-section" class="results-container hide">
            <div class="table-header">
                <h3><i data-lucide="list"></i> Hasil Scraping</h3>
                <div class="header-actions">
                    <button id="btn-export-csv" class="btn-export hide"><i data-lucide="download"></i> Download CSV</button>
                    <button id="btn-export-json" class="btn-export hide"><i data-lucide="download"></i> Download JSON</button>
                    <div class="badges">
                        <span class="badge badge-success" id="count-success">0 Ditemukan</span>
                    </div>
                </div>
            </div>
            
            <div class="table-wrapper">
                <table id="results-table">
                    <thead>
                        <tr>
                            <th>Creator / KOL</th>
                            <th>Platform</th>
                            <th>Bio / Niche</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="results-body">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
